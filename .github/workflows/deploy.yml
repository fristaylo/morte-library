name: Build & Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - name: Compute lowercase image name
              id: meta
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build & push site
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: site/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:site
                      ${{ steps.meta.outputs.image }}:site-${{ github.sha }}
                  cache-from: type=gha,scope=site
                  cache-to: type=gha,mode=max,scope=site

            - name: Build & push api
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: api/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:api
                      ${{ steps.meta.outputs.image }}:api-${{ github.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Copy deploy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  source: docker-compose.yml
                  target: ~/morte-library

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              env:
                  SITE_IMAGE: ${{ needs.build.outputs.image }}:site-${{ github.sha }}
                  API_IMAGE: ${{ needs.build.outputs.image }}:api-${{ github.sha }}
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APP_USER: ${{ secrets.USER }}
                  APP_PASSWORD: ${{ secrets.PASSWORD }}
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  envs: SITE_IMAGE,API_IMAGE,GHCR_USER,GHCR_TOKEN,APP_USER,APP_PASSWORD
                  script: |
                      set -e
                      cd ~/morte-library

                      if ! command -v docker >/dev/null 2>&1; then
                        echo "Docker not found, installing via get.docker.com…"
                        curl -fsSL https://get.docker.com | sh
                        systemctl enable --now docker
                      fi

                      cat > .env <<EOF
                      USER=${APP_USER}
                      PASSWORD=${APP_PASSWORD}
                      EOF
                      chmod 600 .env
                      unset USER

                      echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
                      export SITE_IMAGE API_IMAGE
                      docker compose pull

                      if docker volume inspect ugolok-morte_mysql-data >/dev/null 2>&1 && [ ! -f .migrated ]; then
                        docker compose stop db
                        (cd ~/ugolok-morte && docker compose up -d --wait mysql)
                        (cd ~/ugolok-morte && docker compose exec -T mysql sh -c 'mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" --single-transaction --hex-blob morte') > migrate.sql
                        (cd ~/ugolok-morte && docker compose down)
                        docker compose up -d --wait db
                        docker compose exec -T db sh -c 'mysql -u root -p"$MYSQL_ROOT_PASSWORD" morte_library' < migrate.sql
                        touch .migrated
                      fi

                      if ! docker compose up -d --remove-orphans; then
                        echo "===== deploy failed ====="
                        free -m || true
                        docker compose ps -a || true
                        echo "===== db logs ====="
                        docker compose logs --tail=300 db || true
                        echo "===== api logs ====="
                        docker compose logs --tail=300 api || true
                        exit 1
                      fi
                      mkdir -p /etc/caddy/sites
                      [ -f /etc/caddy/Caddyfile ] || echo 'import sites/*' > /etc/caddy/Caddyfile
                      rm -f /etc/caddy/sites/morte.caddy
                      printf 'lib.agoncharenko.dev {\n\treverse_proxy 127.0.0.1:8081\n}\n' > /etc/caddy/sites/morte-library.caddy
                      if docker inspect caddy >/dev/null 2>&1; then
                        docker exec caddy caddy reload --config /etc/caddy/Caddyfile
                      else
                        docker run -d --name caddy --network host --restart always -v /etc/caddy:/etc/caddy -v caddy_data:/data -v caddy_config:/config caddy:2
                      fi
                      docker image prune -f
                      echo "Deployment finished successfully."
