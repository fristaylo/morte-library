name: Build & Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - name: Compute lowercase image name
              id: meta
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build & push app
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:latest
                      ${{ steps.meta.outputs.image }}:${{ github.sha }}
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,mode=max,scope=app

            - name: Build & push api
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: api
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:api
                      ${{ steps.meta.outputs.image }}:api-${{ github.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Copy deploy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  source: docker-compose.yml,init-letsencrypt.sh
                  target: ~/ugolok-morte

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              env:
                  IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
                  API_IMAGE: ${{ needs.build.outputs.image }}:api-${{ github.sha }}
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APP_USER: ${{ secrets.USER }}
                  APP_PASSWORD: ${{ secrets.PASSWORD }}
              with:
                  host: ${{ secrets.HOST }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  envs: IMAGE,API_IMAGE,GHCR_USER,GHCR_TOKEN,APP_USER,APP_PASSWORD
                  script: |
                      set -e
                      cd ~/ugolok-morte

                      if ! command -v docker >/dev/null 2>&1; then
                        echo "Docker not found, installing via get.docker.com…"
                        curl -fsSL https://get.docker.com | sh
                        systemctl enable --now docker
                      fi

                      cat > .env <<EOF
                      USER=${APP_USER}
                      PASSWORD=${APP_PASSWORD}
                      EOF
                      chmod 600 .env
                      unset USER

                      echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
                      export IMAGE API_IMAGE
                      docker compose pull
                      chmod +x init-letsencrypt.sh
                      ./init-letsencrypt.sh
                      docker image prune -f
