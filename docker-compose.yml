services:
    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_DATABASE: morte
            MYSQL_USER: ${USER:?}
            MYSQL_PASSWORD: ${PASSWORD:?}
            MYSQL_ROOT_PASSWORD: ${PASSWORD:?}
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            retries: 20
            start_period: 30s

    api:
        image: ghcr.io/fristaylo/morte-library:api
        build:
            context: .
            target: api
        restart: always
        env_file: .env
        environment:
            DB_HOST: mysql
        ports:
            - "127.0.0.1:3001:3001"
        depends_on:
            mysql:
                condition: service_healthy

    app:
        image: ghcr.io/fristaylo/morte-library:latest
        build: .
        ports:
            - "80:80"
            - "443:443"
        restart: always
        volumes:
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot:ro
        command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
        depends_on:
            - api

    certbot:
        image: certbot/certbot
        restart: always
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
    mysql-data:
