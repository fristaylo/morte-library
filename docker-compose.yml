name: morte-library

services:
    db:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${PASSWORD:?}
            MYSQL_DATABASE: morte_library
        command:
            - --innodb-buffer-pool-size=64M
            - --performance-schema=OFF
            - --max-connections=30
            - --table-open-cache=64
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s

    api:
        image: ${API_IMAGE:-morte-library-api}
        build:
            context: .
            dockerfile: api/Dockerfile
        restart: always
        env_file: .env
        ports:
            - "127.0.0.1:3001:3001"
        depends_on:
            db:
                condition: service_healthy

    site:
        image: ${SITE_IMAGE:-morte-library-site}
        build:
            context: .
            dockerfile: site/Dockerfile
        restart: always
        ports:
            - "127.0.0.1:8081:80"
        depends_on:
            - api

volumes:
    db-data:
