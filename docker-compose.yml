services:
    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_DATABASE: morte
            MYSQL_USER: ${USER:?}
            MYSQL_PASSWORD: ${PASSWORD:?}
            MYSQL_ROOT_PASSWORD: ${PASSWORD:?}
        command:
            - --innodb-buffer-pool-size=64M
            - --performance-schema=OFF
            - --max-connections=30
            - --table-open-cache=64
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 120s

    api:
        image: ${API_IMAGE:-ghcr.io/fristaylo/morte-library:api}
        build:
            context: .
            target: api
        restart: always
        env_file: .env
        environment:
            DB_HOST: mysql
        ports:
            - "127.0.0.1:3001:3001"
        depends_on:
            mysql:
                condition: service_healthy

    app:
        image: ${IMAGE:-ghcr.io/fristaylo/morte-library:latest}
        build: .
        ports:
            - "127.0.0.1:8081:80"
        restart: always
        depends_on:
            - api

volumes:
    mysql-data:
