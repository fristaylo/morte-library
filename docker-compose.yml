services:
    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_DATABASE: ${DB_NAME:?}
            MYSQL_USER: ${DB_USER:?}
            MYSQL_PASSWORD: ${DB_PASSWORD:?}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            retries: 20
            start_period: 30s

    api:
        image: ghcr.io/fristaylo/morte-library:api
        build:
            context: .
            target: api
        restart: always
        env_file: .env
        environment:
            DB_HOST: mysql
        ports:
            - "127.0.0.1:3001:3001"
        depends_on:
            mysql:
                condition: service_healthy

    app:
        image: ghcr.io/fristaylo/morte-library:latest
        build: .
        ports:
            - "80:80"
        restart: always
        depends_on:
            - api

volumes:
    mysql-data:
